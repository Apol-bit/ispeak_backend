name: Frozen Node candidate validation
on:
  push:
    branches: [ci/validate-node-dfa3138f-20261021]
    paths: [.github/workflows/validate-node.yml, validation/remote/**]
permissions:
  contents: read
concurrency:
  group: frozen-node-validation
  cancel-in-progress: false
jobs:
  node-candidate:
    if: github.repository == 'Apol-bit/ispeak_backend' && github.actor == 'Apol-bit' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ROLE: node
      # Official v0.34.1 registry index resolved read-only; pending draft approval.
      BUILDKIT_IMAGE: moby/buildkit@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      AUTOMATION_REVIEW_APPROVED: 'false'
      EXPORT_LOAD_CONTROLS_APPROVED: 'false'
      ACTIONS_STEP_DEBUG: 'false'
    steps:
      - name: Fetch reviewed automation without persistent credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/ci/validate-node-dfa3138f-20261021
          test "$AUTOMATION_REVIEW_APPROVED" = true
          export GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init automation >/dev/null
          git -C automation remote add origin https://github.com/Apol-bit/ispeak_backend.git
          git -C automation -c core.hooksPath=/dev/null fetch --depth=1 origin "$GITHUB_SHA" >/dev/null 2>&1
          git -C automation -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD >/dev/null 2>&1
          test "$(git -C automation rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate frozen Node candidate
        shell: bash
        run: python3 automation/validation/remote/runner.py node
      - name: Remove only run-owned containers and private temporary files
        if: always()
        shell: bash
        run: |
          test ! -f automation/validation/remote/runner.py || python3 automation/validation/remote/runner.py cleanup
