name: Frozen Node candidate validation
on:
  push:
    branches: [ci/validate-node-dfa3138f-20261021]
    paths: [.github/workflows/validate-node.yml, validation/remote/**]
permissions:
  contents: read
concurrency:
  group: frozen-node-validation
  cancel-in-progress: false
jobs:
  node-candidate:
    if: github.repository == 'Apol-bit/ispeak_backend' && github.actor == 'Apol-bit' && github.run_attempt == 1
    environment: ispeak-node-private-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch approved read-only authorization tooling
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init automation >/dev/null
          git -C automation remote add origin https://github.com/Apol-bit/ispeak_backend.git
          git -C automation -c core.hooksPath=/dev/null fetch --depth=1 origin "$GITHUB_SHA" >/dev/null 2>&1
          git -C automation -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD >/dev/null 2>&1
          test "$(git -C automation rev-parse HEAD)" = "$GITHUB_SHA"
      - name: One GET-only GHCR authorization check
        shell: bash
        env:
          PUBLISHER_TOKEN: ${{ secrets.ISPEAK_GHCR_PUBLISHER }}
        run: python3 -B automation/validation/remote/ghcr_auth_check.py
